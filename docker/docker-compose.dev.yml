services:
  # Use root/example as user/password credentials
  adminer:
    image: adminer
    restart: unless-stopped
    networks:
      - matiix310-dev-db
    ports:
      - "8080:8080"

  db:
    image: mysql:lts
    restart: unless-stopped
    env_file: "db.env"
    environment:
      MYSQL_DATABASE: website
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - matiix310-dev-db

  api:
    build:
      context: ../api/
      dockerfile: ../api/Dockerfile
      target: dev
    env_file: "api.env"
    restart: unless-stopped
    networks:
      - matiix310-dev-db
      - matiix310-dev-proxy
    depends_on:
      - db
    volumes:
      - downloads:/usr/downloads
    develop:
      watch:
        - action: sync
          path: ../api/
          target: /usr/src/app/
          ignore:
            - ../api/node_modules/
            - ../api/package.json
            - ../api/run.sh
        - action: rebuild
          path: ../api/package.json
        - action: rebuild
          path: ../api/run.sh

  frontend:
    build:
      context: ../frontend/
      dockerfile: ../frontend/Dockerfile
      target: dev
    restart: unless-stopped
    networks:
      - matiix310-dev-proxy
    develop:
      watch:
        - action: sync
          path: ../frontend/
          target: /app/
          ignore:
            - ../frontend/node_modules/
            - ../frontend/.next/
            - ../frontend/package.json
        - action: rebuild
          path: ../frontend/package.json

  reverse-proxy:
    image: nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - 80:80
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - matiix310-dev-proxy

volumes:
  downloads:
  mysql:

networks:
  matiix310-dev-db:
  matiix310-dev-proxy:
